name: Publish driver package

on:
  release:
    types: [published]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Build and publish driver
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install root dependencies
        run: npm ci

      - name: Assert release tag matches package.json version
        shell: bash
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${{ github.event_name }}" = "release" ]; then
            TAG="${{ github.event.release.tag_name }}"
            TAG_VERSION="${TAG#v}"
            echo "package.json version: ${PKG_VERSION}"
            echo "release tag: ${TAG} (normalized: ${TAG_VERSION})"
            if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
              echo "::error::Tag version (${TAG_VERSION}) does not match package.json (${PKG_VERSION})"
              exit 1
            fi
          else
            echo "workflow_dispatch: skipping tag check; publishing package.json version ${PKG_VERSION}"
          fi

      - name: Build driver package
        run: npm run build

      - name: Publish driver to npm
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access public --provenance
